[project]
name = "callback"
version = "0.1.0"
description = "AI help-desk actions governed by a stateful twin and signed effects"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28,<0.29",
  "python-dotenv>=1.1,<2",
  "jsonschema>=4.25,<5",
  "pillow>=11,<13",
  "boto3>=1.40,<2",
  "pyyaml>=6,<7",
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "cryptography>=46,<48",
  "rfc8785>=0.1.4,<1",
  "dnslib>=0.9.26,<1",
  "playwright>=1.56,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.local/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
