[project]
name = "callback"
version = "0.1.0"
description = "AI help-desk actions governed by a stateful twin and signed effects"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28,<0.29",
  "python-dotenv>=1.1,<2",
  "jsonschema>=4.25,<5",
  "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
